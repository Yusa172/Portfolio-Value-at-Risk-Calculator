[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "var-calculator"
description = "Portfolio Value-at-Risk and Expected Shortfall calculator."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Simão Fiúza" }]
dynamic = ["version"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/Yusa172/Portfolio-Value-at-Risk-Calculator"

[tool.setuptools.dynamic]
version = { attr = "var_calculator.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
